name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AC-KIT-001.1 / 001.2 / 001.3 — the workspace verifies as one gated unit
      - run: pnpm -r build
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm -r test
